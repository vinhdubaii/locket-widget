name: Release

# Push a tag and this builds the installer and publishes a GitHub Release:
#   git tag 0.1.0
#   git push origin 0.1.0
# If you create the release on the GitHub website instead, the installer is
# attached to that release.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # self-contained: users do not have to install .NET or the Windows App SDK
      - name: Publish
        run: >
          dotnet publish LocketWidget.csproj
          -c Release
          -r win-x64
          -p:Platform=x64
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:Version=${{ steps.version.outputs.value }}
          -o publish

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.value }}" installer\LocketWidget.iss

      # create the release, or just attach the installer if it already exists
      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER: dist/LocketWidget-Setup-${{ steps.version.outputs.value }}.exe
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$INSTALLER" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$INSTALLER" \
              --title "LocketWidget ${{ steps.version.outputs.value }}" \
              --generate-notes
          fi
