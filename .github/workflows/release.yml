name: Release

# Day tag la tu dong build + tao GitHub Release, vi du:
#   git tag 0.1.0
#   git push origin 0.1.0
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # self-contained: may nguoi dung khong can cai .NET 8
      - name: Publish
        run: >
          dotnet publish LocketWidget.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:Version=${{ steps.version.outputs.value }}
          -o publish

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish\LocketWidget.exe -DestinationPath LocketWidget-${{ steps.version.outputs.value }}-win-x64.zip

      # Tao release moi neu chua co, con neu da tao san tren giao dien GitHub
      # thi chi upload file zip vao release do
      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: LocketWidget-${{ steps.version.outputs.value }}-win-x64.zip
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" \
              --title "LocketWidget ${{ steps.version.outputs.value }}" \
              --generate-notes
          fi
